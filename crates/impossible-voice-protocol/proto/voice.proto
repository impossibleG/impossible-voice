syntax = "proto3";

package impossible.voice.v1;

service Voice {
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc StreamTranscribe(stream StreamTranscribeRequest) returns (stream TranscriptEvent);
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc StreamSynthesize(SynthesizeRequest) returns (stream AudioChunk);
}

message TranscribeRequest {
  bytes audio = 1;
  AudioEncoding encoding = 2;
  uint32 sample_rate = 3;
}

message TranscribeResponse {
  string text = 1;
}

message StreamConfig {
  uint32 sample_rate = 1;
}

message StreamTranscribeRequest {
  oneof event {
    StreamConfig config = 1;
    bytes audio = 2;
    bool commit = 3;
    bool cancel = 4;
  }
}

message TranscriptEvent {
  string text = 1;
  bool final = 2;
}

message SynthesizeRequest {
  string input = 1;
  float speed = 2;
  AudioEncoding encoding = 3;
}

message SynthesizeResponse {
  bytes audio = 1;
  AudioEncoding encoding = 2;
  uint32 sample_rate = 3;
  uint32 channels = 4;
}

message AudioChunk {
  bytes audio = 1;
  uint32 sequence = 2;
  bool final = 3;
  uint32 sample_rate = 4;
  uint32 channels = 5;
  string chunking = 6;
}

enum AudioEncoding {
  AUDIO_ENCODING_UNSPECIFIED = 0;
  AUDIO_ENCODING_WAV_PCM16 = 1;
  AUDIO_ENCODING_RAW_PCM16 = 2;
}
