[workspace]
members = [
    "crates/impossible-voice-audio",
    "crates/impossible-voice-domain",
    "crates/impossible-voice-protocol",
    "crates/impossible-voice-server",
    "crates/impossible-voice-stt",
    "crates/impossible-voice-tts",
]
exclude = ["vendor/impossible-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.6", features = ["http1", "json", "tokio"] }
clap = { version = "=4.5.50", features = ["derive"] }
http-body-util = "=0.1.3"
impossible-server-core = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-core" }
impossible-server-testkit = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-testkit" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = "=1.48.0"
toml = "=0.9.8"
tower = { version = "=0.5.2", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
