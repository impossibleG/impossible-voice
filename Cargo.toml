[workspace]
members = [
    "crates/impossible-voice-audio",
    "crates/impossible-voice-domain",
    "crates/impossible-voice-protocol",
    "crates/impossible-voice-server",
    "crates/impossible-voice-stt",
    "crates/impossible-voice-tts",
]
exclude = ["vendor/impossible-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
