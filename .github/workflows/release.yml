name: Release archives

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: target/release/impossible-voice.exe
            extension: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: target/release/impossible-voice
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.0
        with:
          toolchain: 1.85.0
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --bin impossible-voice
      - shell: pwsh
        run: ./scripts/package.ps1 -PlatformLabel '${{ matrix.platform }}' -BinaryPath '${{ matrix.binary }}'
      - if: matrix.platform == 'linux-x86_64'
        run: ./scripts/test-linux-package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: impossible-voice-${{ matrix.platform }}
          path: |
            dist/impossible-voice-*-${{ matrix.platform }}.${{ matrix.extension }}
            dist/impossible-voice-*-${{ matrix.platform }}.${{ matrix.extension }}.sha256
          if-no-files-found: error
